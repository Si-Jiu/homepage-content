    # 打字机动效 | Typewriter animation
    typewriter:
      enable: true
      # 单字键入间隔（ms）| Typing interval per character (ms)
      speed: 50
      # 反向删除间隔（ms）| Backspace interval (ms)
      deleteSpeed: 25
      # 键入完成后停留时长（ms）| Pause after typing (ms)
      pauseTime: 2000
      # 循环播放 | Loop playback
      loop: true
  # 多图自动轮播 | Auto carousel for multiple images
  carousel:
    enable: true
    # 切换间隔（ms），最小 3000 | Switch interval (ms), minimum 3000
    interval: 4500
