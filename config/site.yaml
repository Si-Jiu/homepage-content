# ── 性能优化与界面细节 | Performance & UI Details ──────────

# 图片优化规则 | Image optimization rules
imageOptimization:
  # 需要绕过防盗链的域名列表，会自动添加无引用头属性
  #
  # Domains requiring hotlink bypass; adds referrer="no-referrer" attribute automatically
  noReferrerDomains:
    - "*.hdslb.com"

# 文章目录 | Table of contents
toc:
  enable: true
  # 最大展示深度（1–3）| Maximum display depth (1–3)
  depth: 2

# 页面顶部加载进度条 | Loading progress bar at top of page
progressIndicator:
  # 进度条样式
  # ├─ dual   : 双向扫描
  # └─ single : 单向扫描
  #
  # Progress bar style
  # ├─ dual   : Bidirectional scan
  # └─ single : Unidirectional scan
  style: "dual"

# 站点图标，留空则使用主题默认图标 | Site favicon; leave empty for theme default
favicon: []
