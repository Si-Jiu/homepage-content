  # 图片裁切焦点："top" | "center" | "bottom"
  position: "center"
  # 遮罩配置，覆盖微暗层以提升前景文字对比度
  dim:
    enable: true
    opacity: 0.24
  # 首页横幅文字
  homeText:
    enable: true
    title: "肆鸠的主页"
    # 副标题列表，支持配置多条用于打字机切换
    subtitle:
      - "终于有人看了QWQ"
      -  "Ciallo～(∠・ω< )⌒★"
      -  "柚子厨真恶心🤮"
      -  "还是PVP大佬"
      -  "Attention, this announcement s-SYSTEM NOW UNDER MILITARY COMMAND"
      -  "我问你我能不能大声说话！😡"
      -  "UIU黑完之后是无规则状态"
      -  "他们站的太密集了"
      -  "现在他在恶意开庭"
      -  "mumu学长的恩情还不完😭"
      -  "huzuo学长的恩情还不完😭"
      -  "Raslo的恩情还不完😭"
      -  "Never gonna give you up~"
      -  "Never gonna let you down~"
      -  "还是PVP大佬"
      -  "我是高性能的嘛！"
      -  "我们西方国家的朋友们"
      -  "要为可耻共谋刺杀金杰而"
      -  "作！出！回！答！"
      -  "What was you mission in Shanghai!"
      -  "做个文明中国人"
      -  "掉皮掉肉不掉队！"
      -  "我们安全了……暂时。"
      -  "Time Limit Exceeded"
      -  "EDD mounted, let them come!"
      -  "相位不规范,死法安德森"
      -  "但是话又说回来了"
    # 打字机动效
    typewriter:
      enable: true
      speed: 50         # 单字键入间隔，单位毫秒
      deleteSpeed: 25     # 反向删除间隔，单位毫秒
      pauseTime: 2000     # 键入完成后停留时长，单位毫秒
      loop: true          # 是否循环播放
  # 多图自动轮播
  carousel:
    enable: true
    interval: 4500        # 切换间隔，单位毫秒，最小 3000
    fadeDuration: 1200    # 淡入淡出过渡时长，单位毫秒
    # 运镜动效："ken-burns" | "zoom-in" | "zoom-out" | "pan-left" | "pan-right" | "none"
    animation: "ken-burns"
  # 底部动态波浪
  waves:
    enable: true

# 图片优化规则
imageOptimization:
  # 需要绕过防盗链的域名列表，会自动添加无引用头属性
  noReferrerDomains:
    - "*.hdslb.com"

# 文章目录
toc:
  enable: true
  depth: 2               # 最大目录展示深度，范围 1 到 3

# 页面顶部加载进度条
progressIndicator:
  # 进度条样式："dual" 双向扫描，"single" 单向扫描
  style: "dual"

