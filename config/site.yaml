# ┌──────────────────────────────────────────────────────────
# │ 站点全局基础配置
# │ 覆盖配置：src/config/siteConfig.ts
# │ 未配置的项自动沿用主题默认值
# │
# │ Site global base configuration
# │ Overrides: src/config/siteConfig.ts
# │ Unspecified items retain theme defaults
# └──────────────────────────────────────────────────────────

# ── 站点全局基础信息 | Global Site Metadata ───────────────

# 站点发布地址，必须以斜杠结尾 | Site URL, must end with a slash
site: "https://sijiu49.moe/"

# 站点子路径，若部署在根目录保持 "/" 即可 | Site base path; keep "/" if deployed at root
base: "/"

# 站点标题与副标题 | Site title and subtitle
title: "肆鸠的主页"
subtitle: "终于有人看了AWA"

# 站点语言代码 | Site language code
# 示例 | Examples: zh_CN, en, ja
lang: "zh_CN"

# 站点时区（IANA 时区名称） | Site timezone (IANA timezone name)
# 示例 | Examples: Asia/Shanghai, Asia/Tokyo, America/New_York
# 用于精确解析文章发布时间（publishedAt、updatedAt）并统一文章排序与归档日期
#
# Used to parse post times (publishedAt, updatedAt) and unify post sorting and archives
timeZone: "Asia/Shanghai"

# ── 顶栏排版与显示设置 | Top Bar & Display Settings ────────

# 顶栏对齐排版 | Top app bar alignment
topAppBar:
  # 电脑端顶栏标题与导航内容区域对齐方式
  # ├─ left   : 靠左对齐
  # └─ center : 居中对齐
  #
  # Desktop top bar title and navigation content alignment
  # ├─ left   : Left
  # └─ center : Center
  contentAlign: "center"

# 显示设置面板：控制前端访客可调节的显示偏好开关
#
# Display settings panel: controls visitor-adjustable display preferences
displaySettings:
  colorStyle: true       # 配色风格选择器 | Color style grid selector
  colorSpec: true        # 配色规范切换 | Color spec toggle
  wallpaperMode: true    # 壁纸背景切换 | Wallpaper mode toggle
  layoutMode: true       # 列表布局切换 | Post list layout toggle
  reduceMotion: true     # 减弱动效切换 | Reduce motion toggle
  texture: true          # 背景纹理切换 | Background texture toggle

# ── 主题色彩与背景纹理 | Theme Color & Texture ─────────────

# 主题配色系统 | Theme color system
themeColor:
  # 默认主题色相，范围 0 到 360，默认 315 为粉紫色
  #
  # Default theme hue, range 0-360; 315 is pink-purple
  hue: 240
  # 是否对访客固定主题色，设为 true 则隐藏前台取色器
  #
  # Fix theme color for visitors; true hides the color picker
  fixed: false
  # 配色风格模式 | Color style mode
  # tonalSpot, vibrant, content, expressive, rainbow, fruitSalad,
  # monochrome, neutral, fidelity
  style: "tonalSpot"
  # 设计规范版本 | Design spec version
  # 2021, 2025
  spec: "2025"

# 默认背景模式 | Default wallpaper mode
wallpaperMode:
  # 初始默认背景
  # ├─ banner : 横幅壁纸
  # └─ none   : 纯色背景
  #
  # Initial default background
  # ├─ banner : Banner wallpaper
  # └─ none   : Solid color only
  defaultMode: "banner"

# 页面背景纹理系统 | Page background texture system
texture:
  # 是否启用背景纹理系统 | Enable background texture system
  enable: true
  # 默认纹理预设 | Default texture preset
  # none, starlight, cyber-dots, topography, geometric, sakura
  defaultPreset: "sakura"
  # 默认纹理浓度，建议范围 0.05 到 0.25 | Default texture opacity, recommended range 0.05-0.25
  defaultOpacity: 0.12
  # 是否启用背景微动效，开启减弱动效时会自动保持静止
  #
  # Enable background subtle motion; stays still when reduce motion is on
  allowMotion: true

