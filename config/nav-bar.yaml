# nav-bar.yaml —— 顶部导航栏配置
# 覆盖主题的 src/config/navBarConfig.ts 中的 links 列表，采用整体替换模式
# 支持使用主题内置预设、自定义链接以及包含子菜单的下拉分组

# 常用预设名称：Home, Archive, Friends, Moments, Anime, Compass, Skills, Projects, Devices, Timeline, Albums, Categories, Tags, About

links:
  # 1. 基础预设项，自动使用内置的多语言名称与标准图标
  - preset: Home
  - preset: Posts

  # 2. 下拉子菜单分组
  - name: "归档"
    icon: "material-symbols:archive-outline-rounded"
    children:
      - preset: Archive
      - preset: Categories
      - preset: Tags

  - name: "链接"
    icon: "material-symbols:link-rounded"
    children:
      - preset: Friends
      - preset: Compass

  - name: "我的"
    icon: "material-symbols:person-outline-rounded"
    children:
      # - preset: Moments
      # - preset: Anime
      # - preset: Albums
      - preset: Devices

